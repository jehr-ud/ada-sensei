[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-sensei"
version = "0.1.0"
description = "A tutor-style educational coding agent for Android development with usable-LLM provisioning."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.20",
    "typer>=0.12",
    "rich>=13",
    "textual>=0.86,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ada-sensei = "ada_sensei.cli.app:CLIApp.main"

[project.urls]
repository = "https://github.com/jehr-ud/ada-sensei"

[tool.setuptools.packages.find]
include = ["ada_sensei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["ada_sensei", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]